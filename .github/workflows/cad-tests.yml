name: CAD checks

on:
  push:
    paths:
      - 'cad/**'
      - 'tests/**'
      - '.github/workflows/cad-tests.yml'
  pull_request:
    paths:
      - 'cad/**'
      - 'tests/**'
      - '.github/workflows/cad-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r cad/requirements.txt
      - name: CAD runtime smoke test
        run: python -c "import build123d; from cad.api.main import app; print('CAD runtime import OK')"
      - name: Run tests
        run: python -m pytest -q

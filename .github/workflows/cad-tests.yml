name: CAD checks

on:
  push:
    paths:
      - 'cad/**'
      - 'tests/**'
      - '.github/workflows/cad-tests.yml'
  pull_request:
    paths:
      - 'cad/**'
      - 'tests/**'
      - '.github/workflows/cad-tests.yml'

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenCascade runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrender1 libxext6 libsm6
      - name: Install Python dependencies
        run: python -m pip install -r cad/requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Export FPV 7-inch Classic-X assembly
        run: python -m cad.export_fpv_assembly --output-dir build/fpv_7in_classic_x
      - name: Upload STEP, STL and assembly manifest
        uses: actions/upload-artifact@v4
        with:
          name: FPV_7in_ClassicX_Assembly
          path: build/fpv_7in_classic_x/
          if-no-files-found: error
          retention-days: 30

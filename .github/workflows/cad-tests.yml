name: CAD checks

on:
  push:
    paths:
      - 'cad/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/cad-tests.yml'
  pull_request:
    paths:
      - 'cad/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/cad-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r cad/requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Export STEP assembly
        run: |
          python - <<'PY'
          from cad.modules.advanced_modular_x import export_advanced_modular_x_step
          export_advanced_modular_x_step("dist/FPV_Advanced_Modular_X_R01.step")
          PY
      - name: Upload STEP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPV_Advanced_Modular_X_R01_STEP
          path: dist/FPV_Advanced_Modular_X_R01.step
          if-no-files-found: error
